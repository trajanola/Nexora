{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/Login.css' %}">
</head>
<body>
    <p class="link-voltar"><a href="{% url 'home' %}">&larr; Voltar ao Sumário</a></p>
    <header>
        <h1>Bem-Vindo! Faça Login ou crie uma conta</h1>
    </header>
    <form method="POST">
        
        <label>Nome de Usuário:</label><br>
        <input type="text" name="nome_usuario" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="senha_usuario" required><br><br>

        <div class="botoes-login">
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" class="btn-cadastro" onclick="window.location.href='{% url 'cadastro' %}'">Criar conta</button>
        </div>
    </form>
</body>
</html>
