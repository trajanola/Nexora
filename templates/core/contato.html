{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Nexora</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/faleconosco.css' %}">
</head>
<body class="contact-page">
    <header class="site-header">
        <p class="link-voltar"><a href="{% url 'home' %}">&larr; Voltar ao Sumário</a></p>
        <h1>Fale Conosco</h1>
        <p>Canais de suporte e comunicação institucional.</p>
    </header>
    <main class="page-main">
        <section class="page-card contact-card">
            <form class="page-form" method="post">
                {% csrf_token %}
                <p><label for="nome">Nome:</label><input id="nome" type="text" name="nome" required></p>
                <p><label for="email">E-mail:</label><input id="email" type="email" name="email" required></p>
                <p><label for="mensagem">Mensagem:</label><textarea id="mensagem" name="mensagem" rows="4" required></textarea></p>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>
</body>
</html>
