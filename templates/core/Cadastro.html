{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <p class="link-voltar"><a href="{% url 'login' %}">&larr; Voltar ao Login</a></p>
        <h1>Criar conta</h1>
        <p>Cadastre-se para acessar a plataforma Nexora.</p>
    </header>
    <main class="page-main">
        <section class="page-card">
            <form class="page-form" method="POST">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {% for field in form %}
                    <p>
                        {{ field.label_tag }}
                        {{ field }}
                        {{ field.errors }}
                    </p>
                {% endfor %}
                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
</body>
</html>
