{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/Login.css' %}">
</head>
<body>
    <header class="site-header">
        <p class="link-voltar"><a href="{% url 'home' %}">&larr; Voltar ao Sumário</a></p>
        <h1>Bem-Vindo!<br>Faça Login ou crie uma conta</h1>
    </header>
    <main class="page-main">
        <form class="page-card" method="POST">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            {% if messages %}
                {% for message in messages %}
                    <p class="login-success" role="status">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <label>Digite o email ou nome de usuário</label><br>
            <input type="text" name="nome_usuario" required><br><br>

            <label>Digite a Senha</label><br>
            <input type="password" name="senha_usuario" required><br><br>

            {% if erro_login %}
                <p class="login-error" role="alert">{{ erro_login }}</p>
            {% endif %}<br><br>

            <div class="botoes-login">
                <button type="submit" class="btn-entrar">Entrar</button>
                <button type="button" class="btn-cadastro" onclick="window.location.href='{% url 'cadastro' %}'">Criar conta</button>
            </div>
        </form>
    </main>
    <a class="login-help" href="{% url 'contato' %}" aria-label="Ajuda: ir para Fale Conosco" title="Ajuda / Fale Conosco">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.1 1-1.8 1.4-1.8 3"></path>
            <path d="M12 17.2h.01"></path>
        </svg>
    </a>
</body>
</html>
