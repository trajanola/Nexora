{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Nexora</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/faleconosco.css' %}">
</head>
<body class="contact-page">
    <header class="site-header">
        <p class="link-voltar"><a href="{% url 'home' %}">&larr; Voltar ao Sumário</a></p>
        <h1>Fale Conosco</h1>
        <p>Canais de suporte e comunicação institucional.</p>
    </header>
    <main class="page-main">
        {% if messages %}
            <ul class="mensagens">
                {% for mensagem in messages %}
                    <li class="{{ mensagem.tags }}">{{ mensagem }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <section class="page-card contact-card">
            <form class="page-form" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>
</body>
</html>
